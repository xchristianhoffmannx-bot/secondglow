<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SecondGlow</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F3E9">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:Inter;src:url(fonts/inter.woff2) format('woff2');font-weight:400 600;font-display:swap}
@font-face{font-family:Playfair;src:url(fonts/playfair.woff2) format('woff2');font-weight:500 700;font-display:swap}
:root{--sage:#758F6B;--olive:#4B5D3B;--cream:#F8F3E9;--clay:#C97F63;--brass:#D4AF6B;--gold:#A8843F;--ink:#2F3A26;--mute:#6F7566;--card:#FFFDF8;--line:#E6DDCB}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
main,header{max-width:560px;margin:0 auto}
header{text-align:center;padding:22px 0 6px}
.logo{font:600 34px/1 Playfair,Georgia,serif;letter-spacing:-.5px;color:var(--olive);margin:0;position:relative;display:inline-block}
.logo span{color:var(--gold)}.logo svg{position:absolute;right:-14px;top:-16px;width:34px;height:24px}
.tag{font-size:11px;letter-spacing:.28em;color:var(--mute);margin:6px 0 0}
h1,h2{font-family:Playfair,Georgia,serif;font-weight:500;margin:0}
h1{font-size:30px;line-height:1.12;margin:18px 0 6px}h2{font-size:20px;margin:0 0 10px}
.hint{color:var(--mute);font-size:14px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 1px 2px #4b5d3b0d}
label.f{display:block;margin:0 0 10px}label.f>span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--sage);outline-offset:1px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 16px;cursor:pointer}
.primary{background:var(--olive);color:var(--cream);border:0;width:100%;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.primary:disabled{opacity:.6}
.ghost{width:100%;color:var(--olive);font-weight:600}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.photos div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--line)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos button{position:absolute;top:4px;right:4px;min-height:0;width:30px;height:30px;padding:0;border-radius:50%;background:#2f3a26cc;color:#fff;border:0}
.add{aspect-ratio:1;border:2px dashed var(--sage);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--olive);font-size:13px;cursor:pointer;gap:2px;text-align:center}
.add b{font-size:26px;font-weight:400;line-height:1}
details summary{cursor:pointer;color:var(--olive);font-weight:600;min-height:40px;display:flex;align-items:center}
.out{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.count{font-size:12px;color:var(--mute)}.over{color:var(--clay);font-weight:600}
.copy{width:100%;background:var(--sage);color:#fff;border:0;font-weight:600}
.copy.ok{background:var(--olive)}
.defects{border-color:var(--clay);background:#fbf1ec}.defects h2{color:#9a5a40}
.chk{display:flex;gap:12px;align-items:flex-start;padding:6px 0}.chk input{width:22px;min-height:22px;height:22px;margin:2px 0 0;accent-color:var(--clay);flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}.kv span{color:var(--mute)}
.warn{color:#9a5a40;background:#fbf1ec;border-radius:10px;padding:8px 10px;font-size:14px;margin:10px 0 0}
.banner{background:var(--brass);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:14px;margin:12px 0}
.price b{font-family:Playfair,Georgia,serif;font-size:30px;color:var(--olive);font-weight:600}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;min-height:72px}
.item img,.item i{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--line);flex:none}
.item small{display:block;color:var(--mute)}
.del{min-height:36px;padding:0 10px;color:var(--mute);border:0;background:none}
.spin{width:18px;height:18px;border:2px solid #f8f3e966;border-top-color:var(--cream);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;border-radius:0;background:none;min-height:62px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button.on{color:var(--olive);font-weight:600}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<header>
  <p class="logo">Second<span>Glow</span><svg viewBox="0 0 34 24" aria-hidden="true"><g stroke="#C9A55A" stroke-width="3" stroke-linecap="round"><path d="M17 2v9M6 6l5 7M28 6l-5 7"/></g></svg></p>
  <p class="tag">GIVE SECONDHAND A GLOW-UP.</p>
</header>
<main id="app"></main>
<nav>
  <button data-t="new"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Erstellen</button>
  <button data-t="items"><svg viewBox="0 0 24 24"><path d="M12 5a2 2 0 1 1 2 2c-1 0-2 .6-2 2v1M3 19l9-7 9 7z"/></svg>Meine Artikel</button>
  <button data-t="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 14H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.1a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Einstellungen</button>
</nav>
<input type="file" id="pick" accept="image/*" multiple hidden>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
